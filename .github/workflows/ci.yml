name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Test
        run: go test ./... -shuffle=on -count=2

      - name: Vet
        run: go vet ./...

      - name: Check frontend syntax
        run: node --check cmd/workbuddy-helper/web/app.js

      - name: Cross-build Linux
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false ./...

      - name: Cross-build Windows
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false ./...

      - name: Build Docker image
        run: docker build --tag workbuddy-helper:ci .
